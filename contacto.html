
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Universo | Contacto</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

    <header>
        <h1>Contacto</h1>
        <p>Compartí tu interés por la astronomía</p>
    </header>

    <nav>
        <a href="index.html">Inicio</a>
        <a href="sistema-solar.html">Sistema solar</a>
        <a href="galeria.html">Galería</a>
        <a href="contacto.html">Contacto</a>
    </nav>

    <main>
        <section class="intro">
            <h2>¿Te gusta el universo?</h2>
            <p>
                Completá el siguiente formulario para dejar un comentario
                o compartir qué tema astronómico te interesa.
            </p>
        </section>

        <form action="#" method="post">
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" required>

            <label for="correo">Correo electrónico:</label>
            <input type="email" id="correo" name="correo" required>

            <label for="tema">Tema de interés:</label>
            <input type="text" id="tema" name="tema" required>

            <label for="mensaje">Mensaje:</label>
            <textarea id="mensaje" name="mensaje" required></textarea>

            <button type="submit">Enviar</button>
        </form>
    </main>

    <footer>
        <p>Explorando el Universo | Proyecto educativo de astronomía</p>
    </footer>

</body>
</html>
